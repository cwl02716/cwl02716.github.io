# 首頁會列出這兩個資料夾的文章
mainSections: [post, notes]
rssFullContent: true
favicon: /favicon.png

footer:
  since: 2026

dateFormat:
  published: 2006-01-02
  lastUpdated: 2006-01-02 15:04

sidebar:
  emoji: "📝"
  subtitle: 技術文章、學習筆記與面試心得
  avatar: img/Justin.png

article:
  math: false
  toc: true
  readingTime: true
  license:
    enabled: true
    default: 採用 [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/) 授權

widgets:
  homepage:
    - type: search
    - type: archives
      params: { limit: 5 }
    - type: categories
      params: { limit: 10 }
    - type: tag-cloud
      params: { limit: 15 }
  page:
    - type: toc

colorScheme:
  toggle: true
  default: auto

# 留言區：之後可改用 giscus（以 GitHub Discussions 當留言），見 README
comments:
  enabled: false
  provider: giscus
